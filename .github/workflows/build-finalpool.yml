name: Build finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble implemented tasks
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          entries = json.loads(Path('.github/finalpool-manifest.json').read_text())
          dest = Path('tasks/finalpool')
          if dest.exists():
              import shutil
              shutil.rmtree(dest)
          count = 0
          for entry in entries:
              sha = entry['sha']
              source = entry['source']
              files = subprocess.check_output(
                  ['git', 'ls-tree', '-r', '--name-only', sha, source + '/']
              ).decode().splitlines()
              for source_path in files:
                  relative = source_path.split('/', 3)[3]
                  target = dest / entry['name'] / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(subprocess.check_output(['git', 'show', sha + ':' + source_path]))
                  count += 1
          print(f'Copied {count} files for {len(entries)} tasks.')
          PY
      - name: Commit and push finalpool
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tasks/finalpool
          git diff --cached --quiet || git commit -m 'Add implemented tasks to finalpool'
          git push origin HEAD:refs/heads/finalpool
